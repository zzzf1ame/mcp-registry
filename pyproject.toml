[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-registry"
version = "0.1.0"
description = "MCP Server Registry — discover, evaluate, and install MCP servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "3iXiaGe" }]
keywords = ["mcp", "registry", "fastapi", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "python-slugify>=8.0",
    "httpx>=0.27",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
    "mypy>=1.8",
]
postgres = [
    "asyncpg>=0.29",
]

[project.urls]
Homepage = "https://github.com/3iXiaGe/mcp-registry"
Repository = "https://github.com/3iXiaGe/mcp-registry"
Issues = "https://github.com/3iXiaGe/mcp-registry/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI 的 Depends/Query 就是设计为在参数默认值中调用
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
plugins = ["pydantic.mypy"]
